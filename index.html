<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beginner's journey into web development.">
    <title>Learning Web Development</title>
    <style>
        /* Basic page styles */
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        button { margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h3><p>feeling happy</p>
    <p>I am learning web development!</p></h3>
    <!-- Input section -->
    <label for="user-input">Enter something:</label>
    <input type="text" id="user-input" placeholder="Type here...">
    <br>
    <button id="submit-btn">Submit</button>

    <!-- Footer -->
    <footer>
        <p>Learning Web Development &copy; 2026</p>
    </footer>

    <!-- Basic interactivity -->
    <script>
        document.getElementById('submit-btn').addEventListener('click', function() {
            var val = document.getElementById('user-input').value;
            if (val) alert('You entered: ' + val);
        });
    </script>
</body>
</html>
