<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beginner's journey into web development.">
    <title>Learning Web Development</title>
    <style>
        /* Basic page styles */
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        button { margin-top: 8px; cursor: pointer; }
        nav { background: #333; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
        nav a { color: #fff; text-decoration: none; margin-right: 15px; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        footer { margin-top: 30px; border-top: 1px solid #ccc; padding-top: 10px; font-size: 13px; color: #555; }
        input[type="text"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button { padding: 7px 18px; background: #333; color: #fff; border: none; border-radius: 4px; margin-top: 8px; cursor: pointer; }
        button:hover { background: #555; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
    </nav>

    <h1>Learning Web Development</h1>
    <p>Welcome! This page documents my journey into web development.</p>

    <!-- Topics I am learning -->
    <h2>Topics</h2>
    <ul>
        <li>HTML Structure</li>
        <li>CSS Styling</li>
        <li>JavaScript Basics</li>
        <li>Responsive Design</li>
    </ul>

    <!-- Input section -->
    <h2>Try It Out</h2>
    <label for="user-input">Enter something:</label>
    <input type="text" id="user-input" placeholder="Type here...">
    <br>
    <button id="submit-btn">Submit</button>

    <!-- Footer -->
    <footer>
        <p>Learning Web Development &copy; 2026</p>
    </footer>

    <!-- Basic interactivity -->
    <script>
        document.getElementById('submit-btn').addEventListener('click', function() {
            var val = document.getElementById('user-input').value;
            if (val) alert('You entered: ' + val);
        });
    </script>
</body>
</html>
